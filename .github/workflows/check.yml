# SPDX-License-Identifier: MIT
#
# Runs every check of the flake on each system it supports, on a runner of
# that system: `nix flake check` builds the checks of the system it runs on.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
