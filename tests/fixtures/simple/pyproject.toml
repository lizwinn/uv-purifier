[project]
name = "simple"
version = "0.1.0"
requires-python = ">=3.12"
# attrs installs from a wheel. docopt has only an sdist, so the build
# installs it by building it with the locked setuptools.
dependencies = ["attrs==25.3.0", "docopt==0.6.2"]

[project.scripts]
simple = "simple:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
