[project]
name = "sources"
version = "0.1.0"
requires-python = ">=3.12"
# Every kind of source uv.lock records besides an index:
# - attrs from git, at a tag. It builds with hatch-vcs, which reads its
#   version from git.
# - six from a URL, a GitHub archive whose file name is not an sdist name.
# - localdir from a local directory.
# - localsdist from a local sdist file.
# - localwheel from a local wheel file.
dependencies = ["attrs", "six", "localdir", "localsdist", "localwheel"]

[project.scripts]
sources = "sources:main"

[tool.uv.sources]
attrs = { git = "https://github.com/python-attrs/attrs", tag = "25.3.0" }
six = { url = "https://github.com/benjaminp/six/archive/refs/tags/1.17.0.tar.gz" }
localdir = { path = "vendor/localdir" }
localsdist = { path = "vendor/localsdist-0.4.0.tar.gz" }
localwheel = { path = "vendor/localwheel-0.5.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
