[project]
name = "app"
version = "2.0.0"
description = "The workspace fixture's application."
requires-python = ">=3.12"
dependencies = ["greeting", "six==1.17.0"]

[project.scripts]
app = "app:main"

[tool.uv.sources]
greeting = { workspace = true }

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"
